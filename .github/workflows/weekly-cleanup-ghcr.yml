name: Cleanup GHCR untagged images

on:
  schedule:
    - cron: '0 4 * * 3'   # weekly, Wednesday 4am UTC
  workflow_dispatch:      # allow manual trigger too

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete untagged container images
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: 'openzim'
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: 'cms-api cms-healthcheck cms-mill cms-shuttle cms-ui devdocs freecodecamp gutenberg ifixit kolibri maps mindtouch mwoffliner nautilus nautilus-webui-api nautilus-webui-frontend node-redis openedx phet sotoki surfer ted test-website warc2zim wikihow wp1-frontend wp1-web wp1-workers wp1_selection_tools youtube zim-tools zimfarm-backend zimfarm-background-tasks zimfarm-dnscache zimfarm-healthcheck zimfarm-monitor zimfarm-monitor-child zimfarm-monitor-parent zimfarm-receiver zimfarm-task-worker zimfarm-ui zimfarm-uploader zimfarm-watcher zimfarm-worker-manager zimit zimit-frontend-api zimit-frontend-ui zimwright'
          tag-selection: untagged
          cut-off: 0s
